name: Release

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  release:
    # Privileged release code comes only from successful main push CI.
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
      - name: Release only the current main commit
        id: current
        shell: bash
        run: |
          head="$(git rev-parse HEAD)"
          remote="$(git ls-remote origin refs/heads/main | cut -f1)"
          if [[ "$head" == "$remote" ]]; then
            echo "release=true" >> "$GITHUB_OUTPUT"
          else
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "A newer push exists; its release will include these commits." >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        if: steps.current.outputs.release == 'true'
        with:
          node-version-file: .nvmrc
          cache: yarn
      - name: Install pinned tooling
        if: steps.current.outputs.release == 'true'
        env:
          CI: "true"
        run: |
          corepack enable
          corepack yarn install --frozen-lockfile
      - name: Generate version, tag, and GitHub release notes
        if: steps.current.outputs.release == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: corepack yarn release
